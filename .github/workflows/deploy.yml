# Builds two web versions of the game in game/ with pygbag and publishes both:
#   https://somin-yang.github.io/retrace/         PC browser (keyboard, 960x720)
#   https://somin-yang.github.io/retrace/mobile/  phone (touch controls, 1440x720)
# Both are built from the same source; the mobile build only adds game/mobile.flag.
# --no_opt: keep our stereo OGG files as they are. pygbag's asset optimizer would
# re-encode them to mono 80 kbps, which collapses the music's stereo reverb.
name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag==0.9.3

      - name: Build PC web version
        run: python -m pygbag --build --no_opt --title "RE:TRACE" --width 960 --height 720 game

      - name: Build mobile web version
        run: |
          mkdir -p mobile_build
          cp -r game mobile_build/retrace
          rm -rf mobile_build/retrace/build
          touch mobile_build/retrace/mobile.flag
          python -m pygbag --build --no_opt --title "RE:TRACE Mobile" --width 1440 --height 720 mobile_build/retrace

      - name: Assemble site
        run: |
          mkdir -p site/mobile
          cp -r game/build/web/. site/
          cp -r mobile_build/retrace/build/web/. site/mobile/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
